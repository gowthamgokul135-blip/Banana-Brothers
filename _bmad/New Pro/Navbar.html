<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Brothers - Navbar</title>
    <style>
        /* Reset margins & padding completely */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #222222;
        }

        /* Full Width Navbar - Reduced side padding */
        .navbar {
            background-image: url(bg_blue.png);
            width: 100%;
            background-color: #ffffff;
            padding: 12px 0; /* Vertical padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            flex-wrap: wrap;
        }

        /* Brand Logo */
        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding-left: 16px;
            z-index: 2;
        }

        .logo img {
            margin-left: 30px;
            width: 110px;
            height: auto;
        }

        /* Navigation Links */
        .nav-links {
            padding-right: 290px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            text-decoration: none;
            color: #333333;
            font-size: 0.98rem;
            font-weight: 600;
            transition: color 0.2s ease;
            white-space: nowrap;
            display: inline-block;
            padding-bottom: 2px;
        }

        /* Left to Right Underline Hover Animation */
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 0.5px;
            bottom: 0;
            left: 0;
            background-color: #000000;
            transform: scaleX(0);
            transform-origin: left; /* Animation starts from left */
            transition: transform 0.3s ease-in-out;
        }

        .nav-links a:hover {
            color: #000000;
        }

        .nav-links a:hover::after {
            transform: scaleX(1); /* Expands to right */
        }

        /* Right Section */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 16px;
            z-index: 2;
        }

        /* Search Bar - 280px width & lighter border color */
        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #e0e0e0; /* Border color lightened */
            background-color: #ffffff;
            padding: 6px 12px;
            margin-right: 30px;
        }

        .search-input {
            border: none;
            outline: none;
            font-size: 0.88rem;
            color: #333333;
            width: 280px; /* Search box width fixed at 280px */
            background: transparent;
        }

        .search-input::placeholder {
            color: #999999;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .search-btn svg {
            width: 15px;
            height: 15px;
            fill: #111111;
        }

        /* Icon Buttons Styling - Border removed & radius 0 */
        .icon-btn {
            background: #ffffff;
            border: none; /* Border removed */
            border-radius: 0; /* Border radius set to 0 */
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: #111111;
            transition: background-color 0.2s ease, color 0.2s ease;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .icon-btn:hover svg {
            fill: #ffffff;
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #111111;
            transition: fill 0.2s ease;
        }

        /* Mobile Screen Responsive Styles */
        @media (max-width: 850px) {
            .navbar {
                padding: 10px 12px;
                row-gap: 12px;
            }

            /* Logo Left Corner */
            .logo {
                order: 1;
                padding-left: 0;
            }

            .logo img {
                margin-left: 0;
                width: 85px;
            }

            /* Search Bar & Icons Right Corner */
            .nav-right {
                order: 2;
                padding-right: 0;
                gap: 6px;
            }

            .search-box {
                margin-right: 0;
                padding: 4px 6px;
            }

            .search-input {
                width: 85px; /* Compact search box for mobile screens */
                font-size: 0.78rem;
            }

            .icon-btn {
                margin-right: 0;
                width: 28px;
                height: 28px;
            }

            .icon-btn svg {
                width: 14px;
                height: 14px;
            }

            /* Nav Links below Top bar (Centered) */
            .nav-links {
                order: 3;
                position: static;
                transform: none;
                padding-right: 0;
                width: 100%;
                justify-content: center;
                gap: 16px;
                padding-top: 6px;
                border-top: 1px solid #f0f0f0;
            }

            .nav-links a {
                padding-right: 0;
                font-size: 0.88rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar Container -->
    <nav class="navbar">
        <!-- Brand / Logo -->
        <a href="#" class="logo">
            <img src="bb.jpeg" alt="Banana Brothers Logo">
        </a>

        <!-- Main Navigation Links -->
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Packages</a></li>
            <li><a href="#">My Events</a></li>
        </ul>

        <!-- Search Bar and Action Icons -->
        <div class="nav-right">
            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search..." />
                <button type="button" class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </div>

            <!-- My Booking Icon -->
            <a href="#" class="icon-btn" title="My Booking">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
                </svg>
            </a>

            <!-- User Login Icon -->
            <a href="#" class="icon-btn" title="User Login">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </div>
    </nav>

</body>
</html>
